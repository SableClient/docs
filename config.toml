# The URL the site will be built for
base_url = "https://docs.sable.moe"
title = "Sable Docs"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true


[markdown]
github_alerts = true
external_links_target_blank = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "dracula"

[extra]
meta_author = "Sable contributors"
meta_description = "Documentation for Sable, the open source Matrix client."
meta_keywords = "Sable, Matrix, chat, rooms, client, documentation"
meta_theme_color_light = "#ffffff"
meta_theme_color_dark = "#1b1a21"
meta_image = "img/sable-logo-trans.png"
meta_image_alt = "Sable logo"

[extra.page_icons]
"/" = "house"
"/installation/" = "download-simple"
"/matrix-guide/" = "tree-structure"
"/features/" = "book-open"
"/dev/" = "code"
"/sable-assets/" = "image"
"/features/commands/" = "terminal-window"
"/features/threads/" = "chats-circle"
"/features/notifications/" = "bell"
"/features/privacy/" = "shield-check"
"/features/settings-sync/" = "arrows-clockwise"
"/features/room-abbreviations/" = "text-aa"
"/features/presence/" = "circle"
"/features/personas/" = "user-switch"
"/features/polls/" = "chart-bar"
"/features/location-sharing/" = "map-pin"
"/features/ui-improvements/" = "magnifying-glass"
"/features/developer-tools/" = "bug"
"/dev/contributing/" = "git-pull-request"
